[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarsight-api"
version = "0.1.0"
description = "LunarSight mission-planning prototype API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "numpy>=1.26,<3",
  "rasterio>=1.4,<2",
  "pyproj>=3.6,<4"
]

[tool.setuptools.packages.find]
where = ["."]
