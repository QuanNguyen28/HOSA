[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hosa-api"
version = "0.1.0"
description = "HOSA mission-planning prototype API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "requests>=2.31,<3",
  "filelock>=3.16,<4",
  "rasterio>=1.4,<2",
  "pyproj>=3.6,<4",
  "shapely>=2.1,<3",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pandas>=2.2,<4", "requests>=2.31,<3"]

[tool.setuptools.packages.find]
where = ["."]
